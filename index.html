<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Tracker</title>
<style>
:root{--bg:#f3f3f3;--fg:#111;--card:#fff;--line:#d4d4d4;--mut:#6b6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--fg:#f2f2f2;--card:#161616;--line:#333;--mut:#9a9a9a}}
:root[data-theme="dark"]{--bg:#0b0b0b;--fg:#f2f2f2;--card:#161616;--line:#333;--mut:#9a9a9a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 Arial,Helvetica,sans-serif}
#app{max-width:1200px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0;letter-spacing:1px}
h2{font-size:12px;margin:0 0 10px;letter-spacing:1px;text-transform:uppercase}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--fg);color:var(--bg);border-radius:10px;padding:12px}.k b{display:block;font-size:24px}.k span{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.donut{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;margin:auto}
.donut i{width:48px;height:48px;border-radius:50%;background:var(--fg);display:grid;place-items:center;font:700 12px Arial;color:var(--bg);font-style:normal}
.gw{overflow-x:auto}
table{border-collapse:collapse;font-size:12px}
th,td{padding:0;text-align:center}
th.n{position:sticky;left:0;background:var(--card);text-align:left;padding:2px 10px 2px 0;white-space:nowrap;z-index:1;min-width:150px;font-weight:600}
.dh{font-size:10px;color:var(--mut);min-width:28px;padding:2px}.dh.t{background:var(--fg);color:var(--bg);border-radius:4px}
.tk{width:24px;height:24px;margin:2px;padding:0;border-radius:5px;border:1px solid var(--line);background:var(--card)}
.tk.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
td input{width:26px;margin:1px;padding:2px 0;font-size:11px;text-align:center}
td select{width:28px;margin:1px;padding:2px 0;font-size:11px;appearance:none;text-align:center}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center;font-size:9px;color:var(--mut)}
.bars i{width:100%;background:var(--fg);border-radius:3px 3px 0 0;min-height:1px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.an{width:100%}.an td,.an th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}
.bar{height:8px;background:var(--line);border-radius:4px;min-width:80px}.bar i{display:block;height:100%;background:var(--fg);border-radius:4px}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ins div{border:1px solid var(--line);border-radius:8px;padding:8px}.ins span{display:block;font-size:11px;color:var(--mut)}
textarea{width:100%;height:110px;font:11px monospace;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.hr{display:flex;gap:6px;margin-bottom:6px}.hr input:first-child{width:46px;text-align:center}.hr input:nth-child(2){flex:1}
</style></head><body><div id="app"><p style="text-align:center;margin-top:80px;color:#888">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---- Supabase (public URL + publishable key are safe in the browser) ---- */
const SB=supabase.createClient('https://bdygglgsftpcsvfjszna.supabase.co','sb_publishable_2gBTT2MSxwd7mIrgcTViaw_eRyklSuL');
const DEF=[["Wake up at 05:00","⏰"],["Gym","💪"],["Reading / Learning","📖"],["Day Planning","🗓️"],["No Gooning","💧"],["Project Work","🎯"],["No Alcohol","🍷"],["Social Media Detox","📵"],["Goal Journaling","📓"],["Cold Shower","🚿"],["10k Steps","🚶"],["Plan Tomorrow","📝"]];
let S=null,U=null;
const now=new Date();let Y=now.getFullYear(),M=now.getMonth(),edit=false,bk=false,pend=null;
const pad=n=>String(n).padStart(2,'0'),ds=d=>`${Y}-${pad(M+1)}-${pad(d)}`,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function calc(){
 const n=new Date(Y,M+1,0).getDate(),t=new Date(),ref=(t.getFullYear()==Y&&t.getMonth()==M)?t.getDate():(new Date(Y,M,1)<t?n:0);
 const H=S.habits,days=[...Array(n)].map((_,i)=>i+1),tick=(h,d)=>!!S.checks[h.id+'|'+ds(d)];
 const rows=H.map(h=>{let run=0,best=0,r=[],act=0;days.forEach(d=>{if(tick(h,d)){run++;act++}else run=0;best=Math.max(best,run);r[d]=run});
  const cur=ref?(r[ref]>0?r[ref]:(ref>1?r[ref-1]:0)):0;return{h,act,best,cur,pct:act/n}});
 const daily=days.map(d=>H.length?H.filter(h=>tick(h,d)).length/H.length:0);
 return{n,ref,H,days,tick,rows,daily,goal:H.length*n,done:rows.reduce((a,r)=>a+r.act,0)}}
function RR(){
 const sc=document.querySelector('.gw'),sl=sc?sc.scrollLeft:0,c=calc(),pct=c.goal?c.done/c.goal:0,P=x=>Math.round(x*100)+'%';
 const lg=c.days.map(d=>S.logs[ds(d)]||{}),av=k=>{const v=lg.map(x=>x[k]).filter(x=>x!=null);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'-'};
 const mx=Math.max(...c.daily),bd=mx>0?c.daily.indexOf(mx)+1:null;
 const wk=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((nm,w)=>{const l=c.days.filter(d=>d<=c.ref&&new Date(Y,M,d).getDay()==w);return{nm,v:l.length?l.reduce((a,d)=>a+c.daily[d-1],0)/l.length:0}});
 const wm=Math.max(...wk.map(x=>x.v)),ls=c.rows.reduce((a,r)=>r.best>a.best?r:a,{best:0}),top=[...c.rows].sort((a,b)=>b.act-a.act);
 const low=c.done?[...c.rows].sort((a,b)=>a.act-b.act)[0]:null;
 const tdy=(now.getFullYear()==Y&&now.getMonth()==M)?now.getDate():0;
 let h=`<div class="top"><h1>HABIT TRACKER</h1><div class="row"><button onclick="mv(-1)">‹</button><b>${new Date(Y,M).toLocaleString('en',{month:'long',year:'numeric'})}</b><button onclick="mv(1)">›</button>
 <button onclick="edit=!edit;R()">${edit?'Done':'✎ Habits'}</button><button onclick="exp()">⬇ Export</button><button onclick="so()">Sign out</button><button onclick="th()">◐</button></div></div>`;
 if(edit)h+=`<div class="card"><h2>Customize habits</h2>${S.habits.map(x=>`<div class="hr"><input value="${esc(x.emoji)}" onchange="ed('${x.id}','emoji',this.value)"><input value="${esc(x.name)}" onchange="ed('${x.id}','name',this.value)"><button onclick="mvh('${x.id}',-1)">↑</button><button onclick="mvh('${x.id}',1)">↓</button><button onclick="del('${x.id}')">${pend==x.id?'Sure?':'🗑'}</button></div>`).join('')}
 <div class="hr"><input id="ne" placeholder="🙂"><input id="nn" placeholder="New habit name"><button class="p" onclick="add()">Add</button></div></div>`;
 if(bk)h+=`<div class="card"><h2>Backup / restore</h2><p style="margin:0 0 8px;color:var(--mut)">Copy this text and keep it safe. To restore, paste a backup here and press Restore.</p><textarea id="bt">${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:6px"><button class="p" onclick="rs()">Restore</button></div></div>`;
 h+=`<div class="kpis"><div class="k"><span>Goal</span><b>${c.goal}</b></div><div class="k"><span>Completed</span><b>${c.done}</b></div><div class="k"><span>Left</span><b>${c.goal-c.done}</b></div>
 <div class="k" style="display:grid;place-items:center"><div class="donut" style="background:conic-gradient(var(--bg) ${pct*360}deg,#555 0)"><i>${P(pct)}</i></div></div></div>`;
 h+=`<div class="card gw"><table><tr><th class="n"></th>${c.days.map(d=>`<th class="dh ${d==tdy?'t':''}">${'SMTWTFS'[new Date(Y,M,d).getDay()]}<br><b>${d}</b></th>`).join('')}</tr>
 ${c.H.map(x=>`<tr><th class="n">${esc(x.emoji)} ${esc(x.name)}</th>${c.days.map(d=>`<td><button class="tk ${c.tick(x,d)?'on':''}" onclick="tg('${x.id}',${d})">${c.tick(x,d)?'✓':''}</button></td>`).join('')}</tr>`).join('')}
 <tr><th class="n">Mood (1-5)</th>${c.days.map(d=>`<td><select onchange="lgv(${d},'mood',this.value)"><option></option>${[1,2,3,4,5].map(v=>`<option ${lg[d-1].mood==v?'selected':''}>${v}</option>`).join('')}</select></td>`).join('')}</tr>
 <tr><th class="n">Sleep (hrs)</th>${c.days.map(d=>`<td><input type="number" step="0.5" min="0" max="24" value="${lg[d-1].sleep??''}" onchange="lgv(${d},'sleep',this.value)"></td>`).join('')}</tr></table></div>`;
 h+=`<div class="g2"><div class="card"><h2>Daily progress</h2><div class="bars">${c.days.map((d,i)=>`<div title="Day ${d}: ${P(c.daily[i])}"><i style="height:${c.daily[i]*100}%"></i>${d}</div>`).join('')}</div></div>
 <div class="card"><h2>Completion by weekday</h2><div class="bars">${wk.map(x=>`<div title="${P(x.v)}"><i style="height:${x.v*100}%"></i>${x.nm}</div>`).join('')}</div></div></div>`;
 h+=`<div class="g2"><div class="card"><h2>Analysis</h2><table class="an"><tr><th>Habit</th><th>Done</th><th>Progress</th><th>%</th><th>Streak</th><th>Best</th></tr>
 ${c.rows.map(r=>`<tr><td>${esc(r.h.emoji)} ${esc(r.h.name)}</td><td>${r.act}/${c.n}</td><td><div class="bar"><i style="width:${r.pct*100}%"></i></div></td><td>${P(r.pct)}</td><td>${r.cur}</td><td>${r.best}</td></tr>`).join('')}</table></div>
 <div><div class="card"><h2>Top 10 habits</h2>${top.slice(0,10).map((r,i)=>`<div style="padding:3px 0">${i+1}. ${esc(r.h.emoji)} ${esc(r.h.name)} <span style="color:var(--mut)">(${r.act})</span></div>`).join('')}</div>
 <div class="card"><h2>Insights</h2><div class="ins"><div><span>Overall</span>${P(pct)}</div><div><span>Perfect days</span>${c.daily.filter(v=>v==1&&c.H.length).length}</div>
 <div><span>Best day</span>${bd?'Day '+bd:'-'}</div><div><span>Best weekday</span>${wm>0?wk.find(x=>x.v==wm).nm:'-'}</div><div><span>Longest streak</span>${ls.best?ls.best+' days':'-'}</div>
 <div><span>Strongest</span>${c.done?esc(top[0].h.name):'-'}</div><div><span>Needs attention</span>${low?esc(low.h.name):'-'}</div><div><span>Avg mood</span>${av('mood')}</div><div><span>Avg sleep</span>${av('sleep')}</div></div></div></div></div>`;
 document.getElementById('app').innerHTML=h;const g=document.querySelector('.gw');if(g)g.scrollLeft=sl}
const $=id=>document.getElementById(id);
function msg(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:9';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
async function run(q){const r=await q;if(r.error){msg(r.error.message);await load();R()}return r}
async function load(){
 const a=`${Y}-${pad(M+1)}-01`,b=ds(new Date(Y,M+1,0).getDate());
 const [h,c,l]=await Promise.all([SB.from('habits').select('id,name,emoji,sort').eq('archived',false).order('sort').order('created_at'),
  SB.from('checkins').select('habit_id,day').gte('day',a).lte('day',b),SB.from('daily_logs').select('day,mood,sleep').gte('day',a).lte('day',b)]);
 if(h.error)msg(h.error.message);
 S={habits:h.data||[],checks:{},logs:{}};
 (c.data||[]).forEach(x=>S.checks[x.habit_id+'|'+x.day]=1);
 (l.data||[]).forEach(x=>{const o={};if(x.mood!=null)o.mood=x.mood;if(x.sleep!=null)o.sleep=+x.sleep;S.logs[x.day]=o})}
async function start(){
 const h=await SB.from('habits').select('id',{count:'exact',head:true});
 if(!h.error&&!h.count&&!(U.user_metadata&&U.user_metadata.seeded)){await SB.from('habits').insert(DEF.map((x,i)=>({name:x[0],emoji:x[1],sort:i})));await SB.auth.updateUser({data:{seeded:true}})}
 await load();R()}
function R(){if(!U)return login();if(!S){$('app').innerHTML='<p style="text-align:center;margin-top:80px;color:var(--mut)">Loading…</p>';return}RR()}
function login(){$('app').innerHTML=`<div class="card" style="max-width:360px;margin:60px auto"><h1 style="margin-bottom:10px">HABIT TRACKER</h1><p style="color:var(--mut);margin:0 0 12px">Sign in to sync your habits across all your devices.</p>
 <input id="em" type="email" placeholder="Email" autocomplete="email" style="width:100%;margin-bottom:8px"><input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" style="width:100%;margin-bottom:10px">
 <div class="row"><button class="p" onclick="auth('in')">Sign in</button><button onclick="auth('up')">Create account</button></div><p id="am" style="color:var(--mut);font-size:12px"></p></div>`}
async function auth(k){const email=$('em').value.trim(),password=$('pw').value;$('am').textContent='...';
 const r=k=='in'?await SB.auth.signInWithPassword({email,password}):await SB.auth.signUp({email,password});
 if(r.error){$('am').textContent=r.error.message;return}
 if(k=='up'&&!r.data.session)$('am').textContent='Check your email to confirm your account, then sign in.'}
async function so(){await SB.auth.signOut()}
async function tg(id,d){const k=id+'|'+ds(d),on=!!S.checks[k];if(on)delete S.checks[k];else S.checks[k]=1;R();
 await run(on?SB.from('checkins').delete().eq('habit_id',id).eq('day',ds(d)):SB.from('checkins').insert({habit_id:id,day:ds(d)}))}
async function lgv(d,k,v){const x=ds(d),o=S.logs[x]||(S.logs[x]={});if(v==='')delete o[k];else o[k]=+v;R();
 await run(SB.from('daily_logs').upsert({day:x,[k]:v===''?null:+v},{onConflict:'user_id,day'}))}
async function mv(n){M+=n;if(M<0){M=11;Y--}if(M>11){M=0;Y++}S=null;R();await load();R()}
async function ed(id,k,v){const h=S.habits.find(x=>x.id==id);v=v.trim();if(!h||!v)return;h[k]=v;R();await run(SB.from('habits').update({[k]:v}).eq('id',id))}
async function mvh(id,n){const i=S.habits.findIndex(x=>x.id==id),j=i+n;if(j<0||j>=S.habits.length)return;
 const a=S.habits[i],b=S.habits[j];let sa=a.sort,sb=b.sort;if(sa===sb){sa=i;sb=j}
 a.sort=sb;b.sort=sa;[S.habits[i],S.habits[j]]=[b,a];R();
 await run(SB.from('habits').update({sort:a.sort}).eq('id',a.id));await run(SB.from('habits').update({sort:b.sort}).eq('id',b.id))}
async function del(id){if(pend==id){pend=null;S.habits=S.habits.filter(x=>x.id!=id);R();await run(SB.from('habits').delete().eq('id',id))}else{pend=id;R()}}
async function add(){const n=$('nn').value.trim();if(!n)return;const e=$('ne').value.trim()||'✅',so=S.habits.reduce((a,h)=>Math.max(a,h.sort??0),-1)+1;
 const r=await run(SB.from('habits').insert({name:n,emoji:e,sort:so}).select('id,name,emoji,sort').single());if(r.data){S.habits.push(r.data);R()}}
async function exp(){msg('Preparing export...');const rows=['type,habit,date,value'],nm={};
 const hs=await SB.from('habits').select('id,name');(hs.data||[]).forEach(h=>nm[h.id]=h.name);
 for(let i=0;;i+=1000){const r=await SB.from('checkins').select('habit_id,day').order('day').order('habit_id').range(i,i+999);(r.data||[]).forEach(x=>rows.push(`check,"${(nm[x.habit_id]||'').replace(/"/g,'""')}",${x.day},1`));if(!r.data||r.data.length<1000)break}
 for(let i=0;;i+=1000){const r=await SB.from('daily_logs').select('day,mood,sleep').order('day').range(i,i+999);(r.data||[]).forEach(x=>{if(x.mood!=null)rows.push(`log,mood,${x.day},${x.mood}`);if(x.sleep!=null)rows.push(`log,sleep,${x.day},${x.sleep}`)});if(!r.data||r.data.length<1000)break}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='habit-tracker-export.csv';a.click()}
function th(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'}
SB.auth.onAuthStateChange((ev,ses)=>{const u=ses?ses.user:null;if((u&&u.id)===(U&&U.id)&&ev!=='INITIAL_SESSION')return;U=u;S=null;if(u)setTimeout(start,0);else R()});
</script></body></html>
